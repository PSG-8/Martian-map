name: render-cast
on:
  push:
    branches: [film-cast]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: npm init -y >/dev/null && npm i playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: bash run.sh
      - name: publish result to branch film-cast-out
        run: |
          mkdir pub && cp out/iLabAtHome_Characters.mp4 out/cast_poster.jpg pub/ && cd pub
          git init -q -b film-cast-out && git config user.email "actions@github.com" && git config user.name "actions"
          git add . && git commit -qm "cast film render ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" film-cast-out
