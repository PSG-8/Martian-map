name: fetch-assets
on: { push: { branches: [cast-fetch] } }
permissions: { contents: write }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir pub; while read n u; do [ -n "$n" ] && curl -sfL -o "pub/$n" "$u" && echo "ok $n" || echo "FAIL $n"; done < urls.txt; ls -la pub
          cd pub && git init -q -b cast-assets && git config user.email a@b.c && git config user.name actions && git add . && git commit -qm assets && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" cast-assets
