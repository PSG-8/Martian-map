name: render-explainer-v3
on:
  push:
    branches: [film-ex]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
      - run: pip install -q "kokoro>=0.9.4" soundfile && python vo.py
      - run: npm init -y >/dev/null && npm i playwright@1.49.1 && npx playwright install --with-deps chromium
      - run: bash run.sh
      - name: publish to branch explainer-out
        run: |
          mkdir pub && cp out/iLabAtHome_HowItWorks.mp4 out/how_poster.jpg warp.json pub/ && cd pub
          git init -q -b explainer-out && git config user.email a@b.c && git config user.name actions
          git add . && git commit -qm "explainer v3 ${GITHUB_SHA}" && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" explainer-out
