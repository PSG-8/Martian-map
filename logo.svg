<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 120" role="img" aria-label="Starseekers team logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="planet" cx="34%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ffb685"/>
      <stop offset="0.55" stop-color="#d4562b"/>
      <stop offset="1" stop-color="#561609"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6de"/>
      <stop offset="1" stop-color="#ffc24d"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="58" cy="68" r="38"/></clipPath>
  </defs>
  <!-- back half of the orbit ring -->
  <g transform="rotate(-22 58 68)" fill="none" stroke="#ffe3c8" stroke-width="2.6" stroke-linecap="round">
    <path d="M 2 68 A 56 15 0 0 1 114 68" opacity="0.45"/>
  </g>
  <!-- planet -->
  <circle cx="58" cy="68" r="38" fill="url(#planet)"/>
  <g clip-path="url(#disc)">
    <ellipse cx="40" cy="84" rx="11" ry="5" fill="#6b1d0d" opacity="0.45"/>
    <ellipse cx="66" cy="94" rx="8" ry="3.6" fill="#6b1d0d" opacity="0.4"/>
    <ellipse cx="78" cy="74" rx="6" ry="3" fill="#6b1d0d" opacity="0.35"/>
    <ellipse cx="36" cy="62" rx="5" ry="2.4" fill="#6b1d0d" opacity="0.35"/>
    <circle cx="80" cy="92" r="44" fill="#220804" opacity="0.32"/>
  </g>
  <!-- front half of the orbit ring -->
  <g transform="rotate(-22 58 68)" fill="none" stroke="#ffe3c8" stroke-width="2.6" stroke-linecap="round">
    <path d="M 2 68 A 56 15 0 0 0 114 68"/>
  </g>
  <!-- dotted route leading to the star -->
  <path d="M 26 92 C 44 72, 64 86, 80 56 S 90 40 94 34" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-dasharray="0.1 6" stroke-linecap="round"/>
  <!-- star -->
  <circle cx="94" cy="30" r="20" fill="url(#glow)"/>
  <path d="M94 10 L98.5 25.5 L114 30 L98.5 34.5 L94 50 L89.5 34.5 L74 30 L89.5 25.5 Z" fill="url(#star)"/>
  <text x="134" y="72" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="38" font-weight="800" letter-spacing="3"><tspan fill="#ffcf7a">STAR</tspan><tspan fill="#f6e7dc">SEEKERS</tspan></text>
  <text x="136" y="96" font-family="'Trebuchet MS','Segoe UI',system-ui,sans-serif" font-size="12" letter-spacing="4.5" fill="#d9a37e">MARS ROUTE PLANNING</text>
</svg>
